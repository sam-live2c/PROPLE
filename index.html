<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><polygon points='50,10 88,32 88,76 50,90 12,76 12,32' fill='none' stroke='%233B82F6' stroke-width='10' stroke-linejoin='round'/></svg>" />
    <title>Prople - Social Media Platform & Cozy Community</title>
    <meta name="description" content="Join Prople, a friendly and comfortable social media platform. Share your thoughts, publish project showcases, discuss ideas, and connect with a creative community on Prople." />
    <meta name="keywords" content="social media, social network, community platform, microblogging, share projects, connect with people, creative discussion, digital community, prople, prople app" />
    
    <!-- SEO Optimization & Cache Directives -->
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="googlebot" content="index, follow" />
    <link rel="canonical" href="https://prople.co.in" />
    
    <!-- Open Graph tags for Social Platforms & Search Engines -->
    <meta property="og:locale" content="en_US" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Prople - Social Media Platform & Cozy Community" />
    <meta property="og:description" content="A comfortable social media platform for sharing thoughts, updates, and project showcases in a cozy community. Join us on Prople!" />
    <meta property="og:url" content="https://prople.co.in" />
    <meta property="og:site_name" content="Prople" />
    <meta property="og:image" content="https://prople.co.in/favicon.png" />
    
    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Prople - Social Media Platform & Cozy Community" />
    <meta name="twitter:description" content="Share your thoughts, publish project showcases, and connect with creative minds on Prople." />
    <meta name="twitter:image" content="https://prople.co.in/favicon.png" />
    
    <!-- Google Specific Cache Instructions -->
    <meta name="google" content="notranslate" />

    <!-- Structured Data for Social Networking Application -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Prople",
      "applicationCategory": "SocialNetworkingApplication",
      "operatingSystem": "Web, iOS, Android",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "description": "A modern and cozy social media platform for sharing thoughts, updates, discussions, and showcasing creative projects.",
      "url": "https://prople.co.in"
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Prople",
      "url": "https://prople.co.in",
      "description": "A comfortable social media platform for sharing thoughts, updates, and project showcases."
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
